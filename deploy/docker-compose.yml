services:
  bsky-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bsky-bot
    restart: unless-stopped          # reinicia após queda, reboot do host, OOM
    env_file: .env                   # BSKY_HANDLE / BSKY_APP_PASSWORD
    environment:
      TZ_OFFSET: "-3"
      BSKY_PDS: "https://bsky.social"
      # Nao ha servico 'ollama' neste compose. O Brain.available() usa
      # timeout=3 e cai sozinho para o gerador offline local. Manter um
      # hostname inexistente so atrasava 3s a cada verificacao.
      # Para usar Ollama, adicione o servico e mude para o nome dele.
      OLLAMA_HOST: "http://127.0.0.1:11434"
    volumes:
      - ./state:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    # não expõe porta: o bot só faz conexões de saída
