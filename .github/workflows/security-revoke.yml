name: security-revoke

# Contenção de incidente: data/session.json (accessJwt/refreshJwt) estava
# legível ANONIMAMENTE no branch público `state`.
#
# Só roda por disparo manual. Nunca imprime tokens.
# O bot NÃO para: ao perder a sessão, gh_runner.py faz login fresco com a
# App Password do secret BSKY_APP_PASSWORD (validada pelo auth-check).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: revogar sessao vazada
        id: rv
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO:  ${{ github.repository }}
          BSKY_PDS: https://bsky.social
        run: python scripts/revoke_leaked_session.py

      - name: "SEGURANCA: sessao revogada e confirmada"
        if: startsWith(steps.rv.outputs.decision, 'REVOGADO')
        run: echo ok

      - name: "SEGURANCA: sessao ja estava morta"
        if: startsWith(steps.rv.outputs.decision, 'JA_INVALIDO')
        run: echo ok

      - name: "SEGURANCA: FALHA na revogacao"
        if: startsWith(steps.rv.outputs.decision, 'FALHA') || startsWith(steps.rv.outputs.decision, 'SEM_SESSAO')
        run: exit 1
