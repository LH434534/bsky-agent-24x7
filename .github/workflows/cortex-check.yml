name: cortex-check

# Valida a "qualidade Hollywood" implantada (itens A/B da pesquisa).
# Tudo CONSULTIVO: o criterio de aceitacao e ZERO acao externa.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: instalar dependências reais
        run: pip install -r requirements.txt

      - name: 1/8 self-test do cortex (128 asserts)
        run: python scripts/cortex_selftest.py

      - name: 2/8 prova de nao-regressao dos gates (28 asserts)
        run: python scripts/gate_selftest.py

      - name: 3/8 gate anti-vazamento
        run: python scripts/secret_gate.py --repo .

      - name: 4/8 gate de segurança do próprio repo
        run: python scripts/security_gate.py --repo .

      - name: 5/8 regressão das DMs (20 camadas)
        run: python scripts/dm_selftest.py

      - name: 6/8 probe fim-a-fim no runner (modo padrão)
        id: probe
        run: python scripts/cortex_runner_probe.py

      - name: "CORTEX: status=${{ steps.probe.outputs.status }} asserts=${{ steps.probe.outputs.pass_ }} acoes_externas=${{ steps.probe.outputs.acoes_externas }} chamadas_rede=${{ steps.probe.outputs.chamadas_rede }} auditor_bloqueou=${{ steps.probe.outputs.auditor_bloqueou }}"
        if: always()
        run: echo "resumo registrado no nome do step"

      # Exercita o caminho _plan() -> LLM -> Plan.from_json() -> Auditor com
      # brain mock. NAO liga Ollama: core/brain.py:82 tem timeout=180s, o que
      # bloquearia o heartbeat em producao. Aqui provamos que o caminho roda
      # e continua com ZERO acao externa.
      - name: 7/8 probe em modo ASSISTIDO (LLM mock, ainda 0 ações)
        env:
          BOT_CORTEX_ASSIST: "1"
        run: python scripts/cortex_runner_probe.py

      - name: 8/8 compilação de todos os módulos
        run: |
          python -m py_compile core/cortex.py core/dm.py core/toolkit.py \
            core/human.py core/viral.py gh_runner.py main.py \
            scripts/cortex_selftest.py scripts/cortex_runner_probe.py \
            scripts/gate_selftest.py scripts/dm_selftest.py
          echo "10/10 modulos compilam"
