name: bsky-bot-24x7

on:
  schedule:
    # RE-ARMADOR DIÁRIO (1x/dia), não o mecanismo principal.
    # A cobertura 24h agora vem da CADEIA: cada sessão dispara a próxima ao
    # terminar (step "renovar sessao"). Os 4 crons antigos foram reduzidos a 1
    # para não empilhar runs na fila do `concurrency` quando a cadeia e o
    # cron caírem na mesma janela. Se TUDO mais falhar, este ainda rearma.
    - cron: "7 0 * * *"
  workflow_dispatch:            # disparo manual pelo botão ou pela API
    inputs:
      force_actions:
        description: "Executar uma curtida e uma publicação de teste"
        required: false
        default: false
        type: boolean
      force_text:
        description: "Texto exato da publicação de teste"
        required: false
        default: "Teste de automação: curtindo e publicando pelo agente autônomo."
        type: string

# só um job por vez: o próximo cron espera o anterior terminar, sem sobrepor
concurrency:
  group: bsky-bot-24x7
  cancel-in-progress: false

env:
  # Modelo local gratuito mais forte; cai para 7B/3B se o runner não comportar.
  OLLAMA_MODEL: qwen2.5:14b-instruct
  OLLAMA_FALLBACKS: qwen2.5:7b-instruct qwen2.5:3b-instruct llama3.2:3b
  OLLAMA_HOST:  http://localhost:11434

  # ── DMs ────────────────────────────────────────────────────────────────
  # BOT_DM_REPLY=1 liga o módulo, mas BOT_DM_SHADOW=1 mantém SOMENTE LEITURA:
  # ele lê, aplica as 20 camadas anti-spam e calcula a resposta, mas NUNCA
  # chama sendMessage. Para envio real, troque SHADOW para "0" (ver docs/DM.md).
  # Duas chaves separadas existem para que um typo não dispare mensagens.
  BOT_DM_REPLY: "1"
  BOT_DM_SHADOW: "1"
  DM_DISCLOSURE: "1"

  # ── CORTEX ──────────────────────────────────────────────────────────────
  # "Qualidade Hollywood" = engenharia: memoria com proveniencia, plano JSON
  # com verification+abort, tools tipadas, auditor separado, circuit breaker.
  # CONSULTIVO: observa, propoe, audita e registra — NUNCA executa acao
  # externa, nunca muda o texto publicado. Ver docs/CORTEX.md.
  # ASSIST=0: nao invoca LLM extra (zero custo, zero latencia adicional).
  BOT_CORTEX: "1"
  BOT_CORTEX_SHADOW: "1"
  BOT_CORTEX_ASSIST: "0"

  # ── CONTEXTO + PERSONALIDADES ───────────────────────────────────────────
  # BOT_CONTEXT=1 ancora o texto na hora/dia/estacao reais e BARRA qualquer
  # afirmacao de clima sem observacao confirmada. BOT_WEATHER=0 (default) =
  # modo conservador, sem chamada de rede nova. Se quiser clima real, ponha
  # "1" e libere api.open-meteo.com:443 na politica de saida.
  # BOT_PERSONAS=1 escolhe um arquétipo de voz estavel por dia (6 opcoes).
  BOT_CONTEXT: "1"
  BOT_WEATHER: "0"
  BOT_PERSONAS: "1"
  BOT_TZ: "America/Sao_Paulo"
  TZ_OFFSET: "-3"

jobs:
  bot:
    runs-on: ubuntu-latest        # runner público gratuito; 14B pode cair para 7B/3B
    timeout-minutes: 350          # teto do Actions é 360
    permissions:
      contents: write             # necessário para commitar o estado
      actions: write              # necessário para renovar a própria sessão

    steps:
      - name: registrar inicio
        run: echo "CHAIN_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: cache modelos
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: restore state
        run: |
          # o estado vive no branch 'state' — main só carrega código.
          # (assim um job antigo force-pushando nunca apaga arquivos de código)
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --depth=1 2>/dev/null || true
          mkdir -p data
          git checkout origin/state -- data/ 2>/dev/null || echo "sem branch state ainda"
          ls -la data/ || true

      - name: instala cérebro (ollama + modelo)
        run: |
          chmod +x scripts/setup_brain.sh
          bash scripts/setup_brain.sh
          cat data/brain_model.txt 2>/dev/null || true

      - name: smoke test de imagem
        continue-on-error: true
        run: |
          timeout 300 python3 tests/smoke_image.py 2>&1 | tail -20 || true

      - name: run agent
        # Se o Python travar, SÓ ESTE STEP é cancelado aos 320 min;
        # o job (350 min) continua e os steps if: always() rodam.
        # Sem isso, um timeout no job mata a cadeia de renovação.
        timeout-minutes: 320
        env:
          BSKY_HANDLE:            ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:      ${{ secrets.BSKY_APP_PASSWORD }}
          BSKY_PDS:               https://bsky.social
          TZ_OFFSET:              "-3"
          DAY_POSTS:              "20"
          DAY_REPLIES:            "35"
          DAY_FOLLOWS:            "60"
          DAY_LIKES:              "150"
          DAY_REPOSTS:            "25"
          TICK_MIN:               "60"
          TICK_MAX:               "300"
          STATE_EVERY_MIN:        "12"
          OLLAMA_HOST:            ${{ env.OLLAMA_HOST }}
          TEST_FORCE_ACTIONS:     ${{ github.event.inputs.force_actions || 'false' }}
          FORCE_POST_TEXT:        ${{ github.event.inputs.force_text || '' }}
          RUN_MINUTES:            ${{ github.event.inputs.force_actions == 'true' && '10' || '300' }}
        run: |
          set -o pipefail
          python gh_runner.py 2>&1 | tee /tmp/bsky-agent.log | tail -120

      - name: persist state
        if: always()
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name  "bsky-bot"
          # SEM -f: respeita .gitignore, entao data/session.json (tokens)
          # nao volta para o branch publico 'state'.
          # MAS o passo `restore state` faz checkout do branch `state`, que
          # ja teve session.json versionado: ele volta ao INDICE mesmo com
          # .gitignore. Remover explicitamente antes e depois do add — foi
          # isso que fez o #157 falhar neste exato step.
          git rm --cached -f data/session.json 2>/dev/null || true
          git add data/ 2>/dev/null || true
          git rm --cached -f data/session.json 2>/dev/null || true
          # Defesa em profundidade: .gitignore pode falhar ou ser apagado.
          # Nunca deixar um JWT chegar ao push do branch público.
          #
          # BUG CORRIGIDO (causa de #166/#167/#168/#170 falharem aqui):
          # `git rm --cached` staged uma DELECAO de data/session.json, e
          # `git diff --cached --name-only` lista esse caminho. O grep abaixo
          # casava com a propria remocao e abortava o push — deixando o
          # arquivo versionado no remoto. Agora checamos se o arquivo AINDA
          # esta no indice, e ignoramos delecoes no diff (--diff-filter=ACMRT).
          if git ls-files --error-unmatch data/session.json >/dev/null 2>&1; then
            echo 'ERRO: session.json ainda no indice — abortando push'; exit 1
          fi
          if git diff --cached --name-only --diff-filter=ACMRT | grep -Ei '(session\.json|\.jwt$|\.env$|credentials)'; then
            echo 'ERRO: segredo seria commitado — abortando push'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "state: final $(date -u +%Y-%m-%dT%H:%MZ)" || true
            for i in 1 2 3 4; do
              git push --force origin HEAD:refs/heads/state && break
              sleep $((i*5))
            done
          fi

      # ── 24 h de verdade ──────────────────────────────────────────────
      # Cada sessão, AO TERMINAR, dispara a próxima. Não depende do cron do
      # GitHub (que atrasa/não dispara), não deixa os ~30 min de buraco entre
      # jobs de 300 min e recupera sozinha se o agente cair no meio.
      # O watchdog (15 min) e o cron original ficam como 2ª e 3ª camadas.
      - name: renovar sessao (24h)
        id: chain
        if: always()
        timeout-minutes: 6
        env:
          GH_TOKEN:          ${{ github.token }}
          GH_REPO:           ${{ github.repository }}
          CHAIN_JOB_STATUS:  ${{ job.status }}
          CHAIN_ENABLED:     ${{ vars.BOT_CHAIN || '1' }}
        run: python scripts/chain.py --workflow bsky-bot-24x7.yml --retries 3 --retry-delay 45

      - name: "CADEIA: proxima sessao iniciada"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'DISPARADO') }}
        run: echo "ok"

      - name: "CADEIA: ja havia sessao ativa"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'ATIVO') }}
        run: echo "ok"

      - name: "CADEIA: aguardando watchdog (falha rapida)"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'AGUARDANDO') }}
        run: echo "ok"

      - name: "CADEIA: desligada pelo kill switch"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'DESLIGADO') }}
        run: echo "ok"

      - name: "CADEIA: interrompida por cancelamento"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'CANCELADO') }}
        run: echo "ok"

      - name: "CADEIA: ERRO"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'ERRO') }}
        run: exit 1
