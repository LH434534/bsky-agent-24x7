name: toolkit-check

# Valida o kit SEM postar nada e SEM credencial do Bluesky.
# Roda em todo push que toca o toolkit e sob demanda.
on:
  workflow_dispatch:
  push:
    paths:
      - 'core/toolkit.py'
      - 'core/human.py'
      - 'core/viral.py'
      - 'core/actions.py'
      - 'core/atproto.py'
      - 'scripts/toolkit_selftest.py'
      - 'scripts/human_selftest.py'
      - 'scripts/viral_selftest.py'
      - 'scripts/viral_baseline.json'
      - 'scripts/secret_gate.py'
      - 'scripts/resilience_selftest.py'
      - 'scripts/chain.py'
      - 'gh_runner.py'
      - 'main.py'
      - 'immortal.py'
      - 'core/scheduler.py'
      - '.gitignore'
      - '.github/workflows/bsky-bot-24x7.yml'
      - '.github/workflows/watchdog.yml'
      - 'scripts/toolkit_integration.py'
      - 'scripts/security_gate.py'
      - 'requirements.txt'
      - 'requirements-toolkit.txt'
      - '.github/workflows/toolkit-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python 3.11 (mesma do workflow principal)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: versões instaladas (auditoria)
        run: python -c "from core.toolkit import describe; import json; print(json.dumps(describe(), indent=2))"

      - name: 1/7 self-test do toolkit
        run: python scripts/toolkit_selftest.py

      - name: 2/7 integração com core/atproto.py (sem rede)
        run: python scripts/toolkit_integration.py

      - name: 3/7 catálogo humano (600 capacidades)
        run: python scripts/human_selftest.py

      - name: 4/7 camada viral (consultiva, sem engajamento automatizado)
        run: python scripts/viral_selftest.py

      - name: 5/7 gate de segurança do próprio repo
        run: python scripts/security_gate.py --repo . --json /tmp/security_gate.json

      - name: 6/7 gate anti-vazamento de credenciais
        run: python scripts/secret_gate.py --repo . --json /tmp/secret_gate.json

      - name: 7/7 resiliência e disponibilidade (52 asserts)
        run: python scripts/resilience_selftest.py

      - name: resumo
        if: always()
        run: |
          echo "=== security_gate.json ==="
          cat /tmp/security_gate.json 2>/dev/null || echo "(nao gerado)"
