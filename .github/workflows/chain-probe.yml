name: chain-probe

# Prova FIM-A-FIM de que a auto-renovação funciona, sem esperar 5h30 e sem
# criar loop infinito: cada geração dispara a próxima e para na 3.
#
# Rodar: Actions → chain-probe → Run workflow (deixe chain_gen = 0)
# Esperado: 4 runs (gen 0,1,2,3), todos success, o último com "FIM".

on:
  workflow_dispatch:
    inputs:
      chain_gen:
        description: "geração atual (0 dispara 1, 1 dispara 2, 3 encerra)"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: simular uma sessao do bot
        run: |
          echo "geracao=${{ github.event.inputs.chain_gen || '0' }}"
          sleep 3

      - name: renovar cadeia
        id: chain
        if: always()
        env:
          GH_TOKEN:         ${{ github.token }}
          GH_REPO:          ${{ github.repository }}
          CHAIN_JOB_STATUS: ${{ job.status }}
          CHAIN_ENABLED:    ${{ vars.BOT_CHAIN || '1' }}
          CHAIN_PROBE:      "1"
        run: |
          python scripts/chain.py \
            --workflow chain-probe.yml \
            --gen "${{ github.event.inputs.chain_gen || '0' }}" \
            --max-gen 3

      - name: "CADEIA: proxima geracao disparada"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'DISPARADO') }}
        run: echo ok

      - name: "CADEIA: fim da cadeia (gen 3)"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'FIM') }}
        run: echo ok

      - name: "CADEIA: ERRO"
        if: ${{ always() && startsWith(steps.chain.outputs.decision, 'ERRO') }}
        run: exit 1
