name: debug-run

on:
  workflow_dispatch:

concurrency:
  group: bsky-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q -r requirements.txt
          mkdir -p data
          git checkout HEAD -- data/ 2>/dev/null || true
      - name: probe
        env:
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TZ_OFFSET: "-3"
          RUN_MINUTES: "3"
          STATE_EVERY_MIN: "1"
          TICK_MIN: "25"
          TICK_MAX: "60"
        run: |
          python gh_runner.py 2>&1 | tail -80
      - name: capture
        if: always()
        run: |
          {
            echo "=== git ==="
            git status --porcelain
            echo "=== branch ==="
            git branch --show-current
            echo "=== remote ==="
            git remote -v
            echo "=== data ==="
            ls -la data/
          } > data/debug.txt 2>&1 || true
          git config user.email "bot@users.noreply.github.com"
          git config user.name  "bsky-bot"
          git add -f data/ 2>/dev/null || true
          git commit -q -m "debug $(date -u +%H%M)" || echo "nothing to commit"
          git push origin HEAD || git push --force origin HEAD:refs/heads/main || true
